<html>
<head>

<title>OmNomNom</title>
<link rel="icon" type="image/x-icon" href="/omFlav.png">

</head>
<body>

<div class="tvOverlay">
  <div class="tvDiv">
    <img class="tv" src="homepage/tv.png">
    <img class="redbutton button" src="homepage/redButton.png" onclick="redButton()">
    <img class="yellowbutton button" src="homepage/yellowbutton.png" onclick="yellowButton()">
    <img class="greenbutton button" src="homepage/greenbutton.png" onclick="greenButton()">
    <img class="bluebutton button" src="homepage/bluebutton.png" onclick="blueButton()">
    <img class="pinkbutton button" src="homepage/pinkbutton.png" onclick="goToRandomPage()">
    <div id="container">
      <p id="bouncing-text" onclick="goToRandomPage()">DVD</p>
    </div>
  </div> 
</div>

<script>


function redButton() {
    window.location.href = '/under-construction';}
function yellowButton() {
    window.location.href = '/under-construction';}
function greenButton() {
    window.location.href = '/under-construction';}
function blueButton() {
    window.location.href = '/under-construction';}

const pages = [
    'soundboard',
    'gay-test',
    'onion',
    'pendulum',
    'doodle',
    'spinningcat',
    'dice',
    'milk',
    'funny',
    'gullible',
  ];
  const randomIndex = Math.floor(Math.random() * pages.length);
  const randomPage = pages[randomIndex];

function goToRandomPage() {
  window.location.href = `/${randomPage}`;
}

const container = document.getElementById('container');
const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffffff',
                '#ff88ff', '#88ffff', '#ffff88', '#8888ff', '#88ff88', '#ff8888', '#ff8800',
                '#ff0088', '#88ff00', '#8800ff', '#00ff88', '#0088ff'
];

class BouncingLogo {
    constructor(text) {
        this.element = document.createElement('p');
        this.element.className = 'bouncing-logo';
        this.element.innerText = text;
        this.element.style.fontSize = '5vh';
        this.element.onclick = (event) => {
        const target = this.element.innerText.trim().toLowerCase();
        
        window.location.href = "/" + target;}
        container.appendChild(this.element);

        const containerRect = container.getBoundingClientRect();
        const logoRect = this.element.getBoundingClientRect();

        const maxX = containerRect.width;
        const maxY = containerRect.height;

        this.posX = Math.random() + maxX;
        this.posY = Math.random() + maxY;

        this.velX = (0.1 + Math.random()) * (Math.random() > 0.5 ? 1 : -1);
        this.velY = (0.1 + Math.random()) * (Math.random() > 0.5 ? 1 : -1);

        this.changeColor();
    }

    update() {
        const containerRect = container.getBoundingClientRect();
        const logoRect = this.element.getBoundingClientRect();

        this.posX += this.velX;
        this.posY += this.velY;

        if (this.posX <= 0 || this.posX + logoRect.width >= containerRect.width) {
            this.velX *= -1;
            this.posX = Math.max(0, Math.min(this.posX, containerRect.width - logoRect.width));
            this.changeColor();
        }

        if (this.posY <= 0 || this.posY + logoRect.height >= containerRect.height) {
            this.velY *= -1;
            this.posY = Math.max(0, Math.min(this.posY, containerRect.height - logoRect.height));
            this.changeColor();
            if (Math.random() < 0.5) {
            this.changeText();}
        }

        this.element.style.left = this.posX + 'px';
        this.element.style.top = this.posY + 'px';
    }

    changeColor() {
        const newColor = colors[Math.floor(Math.random() * colors.length)];
        this.element.style.color = newColor;
    }
    changeText() {
    const newText = pages[Math.floor(Math.random() * pages.length)];
    this.element.innerText = newText;
  }
}

function getRandomSubarray(arr, size) {
    const shuffled = [...arr].sort(() => 0.5 - Math.random());
    return shuffled.slice(0, size);
}

const selectedLogos = getRandomSubarray(pages, 5);
const activeLogos = selectedLogos.map(text => new BouncingLogo(text));

function animate() {
    activeLogos.forEach(logo => logo.update());
    requestAnimationFrame(animate);
}

animate();
</script>

<style>

body {
    margin: 0;
    padding: 0;
    font-size: 100px;
    background-color: #221E22;
    font-family: verdana;
}

.tvOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 9999;
  display: flex;
  justify-content: center; 
  align-items: center;
  padding: 20px; 
  box-sizing: border-box;
}

.tvDiv {
  position: relative;
  max-width: 100%;
  max-height: 100%;
}

.tv {
  position: relative;        /* Position relative allows z-index to work */
  z-index: 2;                /* Middle layer */
  max-width: 100%;
  max-height: 90vh;
  display: block;
  pointer-events: none;
}

.button {
  position: absolute;
  z-index: 3;
}

.redbutton {
  top: 70%; 
  left: 22.5%;
  width: 6%;
}

.yellowbutton {
  top: 70.5%; 
  left: 35.1%;
  width: 6%;
}

.greenbutton {
  top: 70.5%; 
  left: 48.2%;
  width: 6%;
}

.bluebutton {
  top: 70.2%; 
  left: 61%;
  width: 6%;
}

.pinkbutton {
  top: 69.8%; 
  left: 73.5%;
  width: 6%;
}

.button:hover {
  filter: brightness(125%);
}

#container {
            position: absolute;
  top: 15%;
  left: 29%;
  width: 45%;
  height: 46%;
  background-color: black; /* Or any color/gradient */
  z-index: 1;
        }

        .bouncing-logo {
            position: absolute;
            margin: 0;
            padding: 5px;
            font-weight: bold;
            font-size: 1.2rem;
            white-space: nowrap;
            user-select: none;
        }

</style>

</body>
</html>
